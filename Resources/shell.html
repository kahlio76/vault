<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Vault</title>
<link rel="stylesheet" href="res/katex/katex.min.css">
<style>
/* One-screen shell. Left: a looping wheel of the current folder. Right: the open note. Bottom: a prompt. */
:root {
  --bg: #000000; --panel: #0A0A0A; --line: #2E2E2E;
  --fg: #FFFFFF; --dim: #8C8C8C;
  --accent: #FFFFFF; --brass: #B8B8B8; --ok: #B8B8B8;
  --mono: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  --step--1: 0.8125rem; --step-0: 0.9375rem; --step-1: 1.125rem; --step-2: clamp(1.75rem, 4vw, 2.5rem);
  color-scheme: dark;
}
:root[data-skin="ember"]     { --bg:#060504; --panel:#0D0B09; --line:#2A241D; --fg:#EFE5D0; --dim:#8F8370; --accent:#E0694F; --brass:#C8954D; --ok:#9DB27A; color-scheme: dark; }
:root[data-skin="bistre"]    { --bg:#1C1815; --panel:#24201B; --line:#3A332B; --fg:#EFE5D0; --dim:#A39680; --accent:#E0694F; --brass:#C8954D; --ok:#9DB27A; color-scheme: dark; }
:root[data-skin="phosphor"]  { --bg:#030604; --panel:#08100A; --line:#18301F; --fg:#B7F5C0; --dim:#5E9468; --accent:#4DFF88; --brass:#D6E36A; --ok:#4DFF88; color-scheme: dark; }
:root[data-skin="parchment"] { --bg:#EFE5D0; --panel:#E6DAC0; --line:#CDBE9E; --fg:#1C1815; --dim:#6B5F4E; --accent:#9A2D1F; --brass:#8A6220; --ok:#4F6B2E; color-scheme: light; }

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--mono); font-size: var(--step-0); line-height: 1.6; overflow: hidden; -webkit-font-smoothing: antialiased; }
a { color: var(--fg); text-underline-offset: 3px; }
a:hover { color: var(--accent); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
::selection { background: var(--fg); color: var(--bg); }

.app { height: 100%; padding-inline: 16px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 0.25rem 0.6rem; padding-block: 0.55rem; border-bottom: 1px solid var(--line); font-size: var(--step--1); min-height: 2.4rem; }
.top .host { color: var(--brass); font-weight: 700; }
.crumbs { display: flex; flex-wrap: wrap; gap: 0.1rem 0.4rem; min-width: 0; color: var(--dim); }
.crumbs button { background: none; border: 0; padding: 0; cursor: pointer; color: var(--dim); max-width: 32ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.crumbs button:hover, .crumbs button:last-child { color: var(--fg); }
.crumbs i { font-style: normal; color: var(--line); }
.top .count { margin-left: auto; color: var(--dim); font-variant-numeric: tabular-nums; }
.shell { position: relative; display: grid; grid-template-columns: 17rem minmax(0, 1fr); min-height: 0; }

/* wheel */
.tree { position: relative; overflow: hidden; border-right: 1px solid var(--line); cursor: ns-resize; user-select: none; touch-action: none; }
.tree button {
  position: absolute; top: 50%; left: 0; width: 12rem; height: 3.5rem; margin-top: -1.75rem;
  display: grid; grid-template-columns: minmax(0, 1fr) auto; align-content: center; gap: 0 0.5rem; text-align: left;
  padding: 0.4rem 0.7rem; border: 1px solid var(--line); background: var(--panel); color: var(--dim); cursor: pointer;
  transform-origin: left center;
  transform: translate(var(--x, 0px), var(--y, 0px)) rotate(var(--r, 0deg)) scale(var(--s, 1));
  opacity: var(--o, 1);
  transition: transform 0.4s cubic-bezier(.2,.8,.2,1), opacity 0.4s;
}
.tree button:hover { color: var(--fg); }
.tree button.on { color: var(--bg); background: var(--accent); border-color: var(--accent); z-index: 2; font-weight: 700; }
.tree button .n { grid-column: 1 / -1; font-size: 0.68rem; color: var(--line); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tree button.on .n, .tree button.on .t { color: var(--bg); }
.tree button .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--step--1); }
.tree button .t { align-self: center; color: var(--dim); font-size: 0.72rem; white-space: nowrap; }
.tree button.up { border-style: dashed; }
.tree .hint { position: absolute; left: 0; bottom: 0.6rem; color: var(--dim); font-size: 0.72rem; }
@keyframes pop { from { opacity: 0; } }
.tree button.enter { animation: pop 0.3s both; }

/* eye + sight lines */
.eye { display: none; position: absolute; right: 0; top: 1rem; margin: 0; font: 700 9px/1 var(--mono); color: var(--line); pointer-events: none; z-index: 3; }
.eye .i { color: var(--dim); } .eye .p { color: var(--accent); }
@media (min-width: 1240px) { .eye { display: block; } }
.gaze { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; }
.wait { display: none !important; }

/* pane */
.main { overflow-y: auto; min-width: 0; padding: 1.25rem 0 3rem 2rem; }
.pane { max-width: 50rem; display: flex; flex-direction: column; gap: 0.9rem; }
.prompt { color: var(--dim); margin: 0; overflow-wrap: anywhere; }
.prompt .u { color: var(--ok); } .prompt .c { color: var(--fg); font-weight: 500; } .prompt .s { color: var(--accent); }
.row { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--panel); color: var(--fg); font-size: var(--step--1); padding: 0.3rem 0.7rem; cursor: pointer; text-decoration: none; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.meta { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0.15rem 1.1rem; font-size: var(--step--1); }
.meta dt { color: var(--brass); } .meta dd { margin: 0; color: var(--dim); overflow-wrap: anywhere; }
.chips { display: flex; flex-wrap: wrap; gap: 0.3rem; font-size: 0.72rem; color: var(--dim); }
.chips span { border: 1px solid var(--line); padding: 0 0.4rem; }
.note { color: var(--dim); font-size: var(--step--1); margin: 0; }
.pager { justify-content: space-between; margin-top: 0.75rem; padding-top: 1rem; border-top: 1px solid var(--line); }

/* rendered markdown */
.doc { overflow-wrap: anywhere; }
.doc > * + * { margin-top: 0.85rem; }
.doc h1 { font-size: var(--step-2); line-height: 1.1; letter-spacing: -0.02em; margin: 0.4rem 0 0; text-wrap: balance; }
.doc h2, .doc h3, .doc h4, .doc h5, .doc h6 { margin: 1.6rem 0 0; line-height: 1.25; }
.doc h2 { font-size: var(--step-1); } .doc h3 { font-size: var(--step-0); } .doc h4, .doc h5, .doc h6 { font-size: var(--step--1); color: var(--dim); }
.doc h2::before { content: "## "; color: var(--dim); font-weight: 400; }
.doc h3::before { content: "### "; color: var(--dim); font-weight: 400; }
.doc p, .doc li { max-width: 68ch; }
.doc ul, .doc ol { margin: 0; padding-left: 1.3rem; display: grid; gap: 0.25rem; }
.doc li::marker { color: var(--dim); }
.doc li.task { list-style: none; margin-left: -1.3rem; }
.doc .box { color: var(--dim); }
.doc a { text-decoration: underline; text-decoration-color: var(--dim); }
.doc a.wl { text-decoration-style: dotted; }
.doc .wl.missing, .doc .missing { color: var(--dim); text-decoration: line-through; text-decoration-color: var(--line); }
.doc code { background: var(--panel); border: 1px solid var(--line); padding: 0 0.3em; font-size: 0.92em; }
.doc pre { margin: 0; padding: 0.8rem 1rem; background: var(--panel); border: 1px solid var(--line); overflow-x: auto; position: relative; }
.doc pre code { background: none; border: 0; padding: 0; font-size: var(--step--1); line-height: 1.55; }
.doc pre code[data-lang]::before { content: attr(data-lang); position: absolute; right: 0.6rem; top: 0.3rem; font-size: 0.68rem; color: var(--dim); }
.doc .math-block { overflow-x: auto; padding: 0.3rem 0; }
.doc .katex-display { margin: 0.2rem 0; }
.doc code.math { color: var(--dim); }
.doc .k { font-weight: 700; } .doc .c { color: var(--dim); font-style: italic; } .doc .s, .doc .n { color: var(--brass); }
.doc blockquote { margin: 0; padding-left: 1rem; border-left: 2px solid var(--line); color: var(--dim); }
.doc hr { border: 0; border-top: 1px solid var(--line); width: 100%; }
.doc img { max-width: 100%; border: 1px solid var(--line); display: block; }
.doc mark { background: var(--fg); color: var(--bg); padding: 0 0.15em; }
.doc kbd { border: 1px solid var(--line); border-bottom-width: 2px; padding: 0 0.35em; font-size: 0.85em; }
.doc small { color: var(--dim); }
.tw { overflow-x: auto; }
.doc table { border-collapse: collapse; font-size: var(--step--1); min-width: 50%; }
.doc th, .doc td { text-align: left; padding: 0.35rem 0.8rem 0.35rem 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.doc th { border-bottom-color: var(--fg); color: var(--brass); font-weight: 500; }
.callout { border: 1px solid var(--line); background: var(--panel); padding: 0.6rem 0.9rem; max-width: 68ch; }
.callout .co-t { font-size: var(--step--1); font-weight: 700; }
.callout .co-t::before { content: "[" attr(data-type) "] "; color: var(--dim); font-weight: 400; text-transform: lowercase; }
.callout .co-b { margin-top: 0.4rem; color: var(--dim); }
.callout .co-b > * + * { margin-top: 0.5rem; }
.callout[data-type="warning"], .callout[data-type="danger"], .callout[data-type="caution"], .callout[data-type="failure"], .callout[data-type="bug"] { border-left: 3px solid var(--fg); }
summary.co-t { cursor: pointer; }

.main.site { padding: 0; overflow: hidden; }
.shell.site .eye { right: auto; left: 1.2rem; top: 0.9rem; }
@media (min-width: 761px) { .shell.site .eye { display: block; } }
.pane.site { max-width: none; height: 100%; gap: 0; }
.pane.site iframe { display: block; width: 100%; height: 100%; border: 0; background: var(--bg); }

/* listings and viewers */
.ls { display: grid; gap: 1px; }
.ls a, .ls div { display: grid; grid-template-columns: minmax(0, 1fr) 6.5rem 6.5rem; gap: 0.75rem; padding: 0.2rem 0; text-decoration: none; color: var(--fg); border-bottom: 1px solid var(--line); font-size: var(--step--1); }
.ls a:hover { color: var(--accent); }
.ls .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ls .nm b { color: var(--dim); font-weight: 400; margin-right: 0.5rem; }
.ls .d { color: var(--dim); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.ls mark { background: var(--fg); color: var(--bg); }
.hit { font-size: var(--step--1); color: var(--dim); grid-column: 1 / -1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.viewer { border: 1px solid var(--line); background: var(--panel); }
.viewer img { display: block; max-width: 100%; margin: 0 auto; }
.viewer iframe { display: block; width: 100%; height: 68vh; border: 0; background: #fff; }
.viewer pre { margin: 0; padding: 1rem; overflow: auto; font-size: var(--step--1); max-height: 68vh; }

/* prompt line */
.foot { border-top: 1px solid var(--line); font-size: var(--step--1); }
#out { padding: 0.5rem 0; border-bottom: 1px solid var(--line); color: var(--dim); white-space: pre-wrap; max-height: 9rem; overflow-y: auto; }
#out b { color: var(--fg); font-weight: 500; }
.line { display: flex; align-items: center; gap: 0.6rem; min-height: 2.4rem; }
.mode { background: var(--accent); color: var(--bg); font-weight: 700; padding: 0.1rem 0.55rem; }
.line label { color: var(--ok); white-space: nowrap; } .line label span { color: var(--accent); }
#cmd { flex: 1; min-width: 0; font: inherit; color: var(--fg); background: none; border: 0; outline: none; caret-color: var(--accent); }
#cmd::placeholder { color: var(--line); }
.bit { color: var(--dim); white-space: nowrap; } .bit span { color: var(--brass); }
.line button { background: none; border: 0; color: var(--dim); cursor: pointer; padding: 0.2rem 0; white-space: nowrap; }
.line button:hover { color: var(--accent); }

/* quick search */
#pal { position: fixed; inset: 0; z-index: 40; background: rgba(0, 0, 0, 0.62); display: flex; justify-content: center; align-items: flex-start; padding-top: 12vh; }
#pal[hidden] { display: none; }
.pal-box { width: min(42rem, 92vw); background: var(--panel); border: 1px solid var(--fg); box-shadow: 0 1.5rem 4rem rgba(0, 0, 0, 0.6); display: flex; flex-direction: column; max-height: 70vh; }
#palq { font: inherit; font-size: var(--step-1); color: var(--fg); background: none; border: 0; border-bottom: 1px solid var(--line); outline: none; padding: 0.8rem 1rem; caret-color: var(--accent); }
#palq::placeholder { color: var(--dim); }
#pall { list-style: none; margin: 0; padding: 0.3rem 0; overflow-y: auto; min-height: 3rem; }
#pall li { display: grid; grid-template-columns: 4.2rem minmax(0, 1fr); gap: 0.75rem; padding: 0.3rem 1rem; cursor: pointer; align-items: baseline; }
#pall li.h { display: block; cursor: default; color: var(--dim); font-size: 0.72rem; text-transform: lowercase; letter-spacing: 0.08em; padding-top: 0.6rem; }
#pall li .k { color: var(--dim); font-size: 0.72rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#pall li .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#pall li .t small { color: var(--dim); margin-left: 0.7rem; font-size: 0.78rem; }
#pall li .s { grid-column: 2; color: var(--dim); font-size: 0.78rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#pall li.on { background: var(--accent); color: var(--bg); }
#pall li.on .k, #pall li.on .t small, #pall li.on .s { color: var(--bg); }
#pall mark { background: none; color: inherit; text-decoration: underline; text-underline-offset: 3px; font-weight: 700; }
#pall .none { display: block; color: var(--dim); padding: 0.8rem 1rem; cursor: default; }
.pal-foot { display: flex; gap: 1.2rem; flex-wrap: wrap; padding: 0.45rem 1rem; border-top: 1px solid var(--line); color: var(--dim); font-size: 0.72rem; }
.pal-foot b { color: var(--fg); font-weight: 500; }

@media (max-width: 760px) {
  .shell { grid-template-columns: minmax(0, 1fr); grid-template-rows: 9.5rem minmax(0, 1fr); }
  .tree { border-right: 0; border-bottom: 1px solid var(--line); }
  .main { padding: 1rem 0 2rem; }
  .bit, .mode, .line label .h { display: none; }
}
@media (prefers-reduced-motion: reduce) { .tree button { transition: none; } .tree button.enter { animation: none; } }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <span class="host">vault</span>
    <nav class="crumbs" id="crumbs" aria-label="Location"></nav>
    <span class="count" id="count"></span>
  </div>
  <div class="shell">
    <nav class="tree" id="tree" aria-label="Files"></nav>
    <pre class="eye" id="eye" aria-hidden="true"></pre>
    <main class="main" id="main">
      <article class="pane" id="pane"></article>
    </main>
  </div>
  <div class="foot">
    <div id="out" hidden></div>
    <div class="line">
      <span class="mode" id="mode">NORMAL</span>
      <label for="cmd"><span class="h">vault </span><span>›</span></label>
      <input id="cmd" type="text" placeholder="help · ls · cd · cat · grep · ⌘K search" autocomplete="off" autocapitalize="off" spellcheck="false">
      <span class="bit" id="bit" aria-hidden="true"><span>[·_·]</span> bit: idle</span>
      <button type="button" id="themeBtn" title="Cycle theme">theme: mono</button>
    </div>
  </div>
</div>

<div id="pal" hidden>
  <div class="pal-box" role="dialog" aria-label="Quick search">
    <input id="palq" type="text" placeholder="Jump to a note, or type > for commands" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Quick search">
    <ul id="pall"></ul>
    <div class="pal-foot"><span><b>↑↓</b> move</span><span><b>↵</b> open</span><span><b>esc</b> close</span><span><b>&gt;</b> commands</span></div>
  </div>
</div>

<script src="res/render.js"></script>
<script src="res/katex/katex.min.js"></script>
<script src="res/katex/mhchem.min.js"></script>
<script>
(() => {
'use strict';
const $ = (id) => document.getElementById(id);
const root = document.documentElement;
const esc = VaultMD.esc;
const native = (m) => { try { window.webkit.messageHandlers.native.postMessage(m); } catch (e) {} };
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
const errors = [];
addEventListener('error', (e) => { errors.push(String(e.message) + ' @' + (e.lineno || '?')); native({ log: 'JS error: ' + e.message }); });
addEventListener('unhandledrejection', (e) => { errors.push('promise: ' + (e.reason && e.reason.message || e.reason)); });

// ---------- data ----------
const NUM = /^(\d+(?:\.\d+)*)\.?\s+/;
const IMG = /^(png|jpe?g|gif|svg|webp|avif|bmp)$/;
const TEXTY = new Set(['txt', 'json', 'csv', 'py', 'js', 'swift', 'c', 'h', 'cpp', 'sh', 'yaml', 'yml', 'toml', 'css', 'xml', 'log', 'ini']);
const extOf = (n) => { const m = /\.([^.]+)$/.exec(n); return m ? m[1].toLowerCase() : ''; };
const enc = (p) => p.split('/').map(encodeURIComponent).join('/');
const S = { cols: [], roots: [], byPath: [], byName: [], vroot: null, container: null, sel: 0, node: null, token: 0, stamps: [], texts: {}, all: null };

function mk(e, ci, parent) {
  const dir = !!e.d;
  return { ci, name: e.n, path: e.p || '', dir, size: e.s || 0, mtime: e.m || 0, parent, children: [], num: null,
    ext: dir ? '' : extOf(e.n), stem: dir ? e.n : e.n.replace(/\.md$/i, '') };
}
const cmpNode = (a, b) => {
  const rank = (n) => (n.dir ? 0 : n.num ? 1 : 2);
  if (rank(a) !== rank(b)) return rank(a) - rank(b);
  if (a.num && b.num) {
    const x = a.num.split('.').map(Number), y = b.num.split('.').map(Number);
    for (let i = 0; i < Math.max(x.length, y.length); i++) if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) - (y[i] || 0);
  }
  return a.stem.localeCompare(b.stem, undefined, { numeric: true, sensitivity: 'base' });
};
// Files named "3.2.1 Title" nest under "3.2 Title" and "3 Title" in the same folder.
function group(list, ci, parent) {
  const nodes = list.map((e) => { const n = mk(e, ci, parent); if (e.d) n.children = group(e.c || [], ci, n); return n; });
  // "_downloads/<hash>/<file>" becomes one flat "downloads" folder; each file keeps its real path.
  for (const n of nodes) {
    if (!(n.dir && n.name === '_downloads')) continue;
    const files = [];
    (function w(x) { for (const c of x.children) { if (c.dir) w(c); else { c.parent = n; files.push(c); } } })(n);
    n.children = files.sort((a, b) => a.stem.localeCompare(b.stem, undefined, { numeric: true, sensitivity: 'base' }));
    n.display = 'downloads';
  }
  for (const n of nodes) if (n.dir && n.name.toLowerCase() === 'attachments') n.quiet = true;   // image storage, not for browsing
  const byNum = new Map();
  for (const n of nodes) { const m = NUM.exec(n.stem); if (m) { n.num = m[1]; if (!n.dir && !byNum.has(m[1])) byNum.set(m[1], n); } }
  const top = [];
  for (const n of nodes) {
    const p = n.num && n.num.includes('.') ? byNum.get(n.num.replace(/\.\d+$/, '')) : null;
    if (p && p !== n) { p.children.push(n); n.parent = p; } else top.push(n);
  }
  top.sort(cmpNode);
  for (const n of nodes) if (!n.dir) n.children.sort(cmpNode);
  return top;
}
function indexTree(ci, raw) {
  const r = { ci, name: S.cols[ci].name, path: '', dir: true, size: 0, mtime: 0, parent: null, children: [], num: null, ext: '', stem: S.cols[ci].name, root: true };
  r.children = group(raw.children || [], ci, r);
  const bp = {}, bn = {};
  (function walk(n) {
    for (const c of n.children) {
      bp[c.path] = c;
      for (const k of [c.name.toLowerCase(), c.stem.toLowerCase()]) if (!(k in bn)) bn[k] = c;
      walk(c);
    }
  })(r);
  S.roots[ci] = r; S.byPath[ci] = bp; S.byName[ci] = bn;
  return r;
}
function buildMaps(ci, r) {
  const bp = {}, bn = {};
  if (r.path) bp[r.path] = r;
  (function walk(n) {
    for (const c of n.children) {
      if (c.path && !(c.path in bp)) bp[c.path] = c;
      for (const k of [c.name.toLowerCase(), c.stem.toLowerCase()]) if (!(k in bn)) bn[k] = c;
      walk(c);
    }
  })(r);
  S.roots[ci] = r; S.byPath[ci] = bp; S.byName[ci] = bn;
}
// The mirrored site's own sidebar is the table of contents: captions become folders, pages nest as in the site.
function parseToc(html) {
  const nav = new DOMParser().parseFromString(html, 'text/html').querySelector('nav.bd-docs-nav');
  if (!nav) return null;
  const txt = (el) => el.textContent.replace(/\s+/g, ' ').trim();
  const items = (ul) => [...ul.children].filter((li) => li.tagName === 'LI').map((li) => {
    const a = li.querySelector(':scope > a'), sub = li.querySelector(':scope > details > ul');
    return a ? { title: txt(a), href: a.getAttribute('href') || '', kids: sub ? items(sub) : [] } : null;
  }).filter(Boolean);
  const groups = [];
  let cap = null, home = null;
  for (const el of (nav.querySelector('.bd-toc-item') || nav).children) {
    if (el.matches('p.caption')) cap = txt(el);

  S.stamps = await Promise.all(S.cols.map((c, i) => fetch('stamp/' + i).then((r) => r.text()).catch(() => '')));
}
async function reloadAll() {
  const keep = S.node && !S.node.virtual ? { c: S.node.ci, p: S.node.path } : null;
  await loadCollections();
  if (!S.cols.length || !home()) return showEmpty();
  const n = keep && S.byPath[keep.c] && S.byPath[keep.c][keep.p];
  goTo(n || home(), { quiet: true });
}
window.vaultReload = reloadAll;
function showEmpty() {
  S.container = { ci: 0, name: 'Vault', path: '', dir: true, children: [], parent: null, virtual: true, stem: 'Vault', num: null, ext: '' };
  S.node = S.container; S.sel = 0;
  tree.textContent = ''; wheelKey = '';
  $('pane').innerHTML = promptLine('ls ~') + '<h1 class="doc-h">No folders yet</h1><p class="note">Use File › Add Folder… (⌘O) to pick a folder of notes. Markdown, PDFs, images and HTML all open here.</p>';
  $('count').textContent = '';
}
setInterval(async () => {
  if (document.visibilityState !== 'visible' || !S.cols.length) return;
  try {
    const now = await Promise.all(S.cols.map((c, i) => fetch('stamp/' + i).then((r) => r.text())));
    if (now.some((s, i) => s !== S.stamps[i])) {
      const was = S.node;
      await reloadAll();
      const cur = was && S.byPath[was.ci] && S.byPath[was.ci][was.path];
      if (cur && cur.ext === 'md' && S.node === cur && cur.mtime !== was.mtime) openNode(cur, { quiet: true });
    }
  } catch (e) {}
}, 2500);

(async function boot() {
  try {
    await loadCollections();
    if (!S.cols.length || !home()) return showEmpty();
    let start = home(), quiet = false;
    try {
      const st = await (await fetch('state')).json();
      const n = st && S.byPath[st.c] && S.byPath[st.c][st.path];
      if (n) { start = n; quiet = true; }
    } catch (e) {}
    goTo(start, { quiet });
  } catch (e) {
    $('pane').innerHTML = promptLine('boot') + '<p class="note">Vault could not start: ' + esc(e.message) + '</p>';
    native({ log: 'boot failed: ' + e.message });
  }
})();

// ---------- hooks used by the self-test (VAULT_SELFTEST) ----------
window.vaultTest = {
  steps: [
    ['home', 'cd ~'], ['calc', 'cd MA 16100'],
    ['key-j-up', 'js:window.dispatchEvent(new KeyboardEvent("keydown", { key: "j" }))'],
    ['key-k-down', 'js:window.dispatchEvent(new KeyboardEvent("keydown", { key: "k" }))'], ['math-note', 'cat L00'], ['math-note-2', 'cat L05'],
    ['key-comma', 'js:window.dispatchEvent(new KeyboardEvent("keydown", { key: "," }))'],
    ['key-period', 'js:window.dispatchEvent(new KeyboardEvent("keydown", { key: "." }))'],
    ['chem', 'cd ~'], ['chem-folder', 'cd CHM 11520'], ['chem-note', 'cat Rec Worksheet'],
    ['engr', 'cd ~'], ['engr-folder', 'cd ENGR 13100'], ['engr-excel', 'cd Excel'], ['engr-page', 'cat 3.2.1'],
    ['grep-all', 'grep derivative'], ['home-again', 'cd ~'],
    ['pal-open', 'js:window.dispatchEvent(new KeyboardEvent("keydown", { key: "k", metaKey: true }))'],
    ['pal-type', 'js:(() => { const i = document.getElementById("palq"); i.value = "infinite lim"; i.dispatchEvent(new Event("input")); })()'],
    ['pal-enter', 'js:document.getElementById("palq").dispatchEvent(new KeyboardEvent("keydown", { key: "Enter" }))'],
    ['pal-open2', 'js:window.dispatchEvent(new KeyboardEvent("keydown", { key: "k", metaKey: true }))'],
    ['pal-text', 'js:(() => { const i = document.getElementById("palq"); i.value = "l\'hospital"; i.dispatchEvent(new Event("input")); })()'],
    ['pal-cmd', 'js:(() => { const i = document.getElementById("palq"); i.value = ">theme em"; i.dispatchEvent(new Event("input")); })()'],
    ['pal-close', 'js:document.getElementById("palq").dispatchEvent(new KeyboardEvent("keydown", { key: "Escape" }))']
  ],


  count() { return this.steps.length; },
  async run(k) {
    const s = this.steps[k];
    if (s[1].startsWith('js:')) { try { new Function(s[1].slice(3))(); } catch (e) { errors.push(String(e)); } } else await run(s[1]);
    await new Promise((r) => setTimeout(r, 2300));
    return JSON.stringify(this.state(s[0]));
  },
  state(name) {
    const n = S.node;
    return { step: name, node: n ? pathOf(n) : null, container: S.container ? S.container.stem : null, sel: S.sel, cards: S.container ? cards(S.container).length : 0,
      palette: { open: pal.open, q: pal.q, n: pal.items.filter((i) => !i.none).length, top: pal.items.filter((i) => !i.none).slice(0, 4).map((i) => (i.cmd ? '> ' + i.title : label(i.node).text + ' [' + i.sec + ']')) }, docChars: $('pane').textContent.length, katex: document.querySelectorAll('.katex').length, brokenImages: [...document.images].filter((i) => i.complete && i.naturalWidth === 0).length, images: document.images.length, wheelOn: (tree.querySelector('button.on') || {}).textContent || null, wheelButtons: tree.querySelectorAll('button').length, waiting: document.querySelectorAll('.wait').length, iframe: !!$('pane').querySelector('iframe'), paneHTML: $('pane').innerHTML.length, crumbs: $('crumbs').textContent, out: out.hidden ? '' : out.textContent.slice(0, 160), errors: errors.slice() };
  },
  async renderAll() {
    const files = allNodes().filter((n) => n.ext === 'md');
    let wiki = 0, missing = 0, relOk = 0, web = 0, failed = [];
    const t0 = performance.now();
    for (const n of files) {
      try {
        const r = VaultMD.render(await getText(n), ctxFor(n));
        wiki += (r.html.match(/class="wl"/g) || []).length;
        missing += (r.html.match(/class="wl missing"/g) || []).length;
        relOk += (r.html.match(/data-p=/g) || []).length;
        web += (r.html.match(/title="Opens the live course site"/g) || []).length;
      } catch (e) { failed.push(n.path + ': ' + e.message); }
    }
    return JSON.stringify({ notes: files.length, totalFiles: allNodes().filter((n) => !n.dir).length, wikiResolved: wiki, missing, noteLinks: relOk, liveSiteLinks: web, failed, ms: Math.round(performance.now() - t0), errors });
  }
};
})();
